query GetProjects(
  $filter: ProjectFilterInput
  $sort: ProjectSortInput
  $first: Int!
  $after: String
) {
  projects(
    filter: $filter
    sort: $sort
    first: $first
    after: $after
  ) {
    totalCount
    nodes {
      id
      name
      status
      owner {
        id
        name
      }
      updatedAt
      version
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
